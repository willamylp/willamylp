<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 412 252" width="412" height="252" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif"><title id="t">Linguagens nos repositórios públicos</title><desc id="d">Card ainda não gerado: aguardando a primeira execução do workflow.</desc><g transform="translate(6 6)"><rect x="0.5" y="0.5" width="399" height="239" rx="12" fill="none" stroke="#3D444D"/><text x="22" y="36" font-size="13.5" font-weight="400" fill="#9198A1" text-anchor="start">Linguagens nos repositórios públicos</text><text x="22" y="118" font-size="14" font-weight="400" fill="#F0F6FC" text-anchor="start">Este card é gerado pelo workflow</text><text x="22" y="140" font-size="14" font-weight="400" fill="#F0F6FC" text-anchor="start">“Atualizar cards do perfil”, no primeiro push.</text><text x="22" y="176" font-size="12.5" font-weight="400" fill="#9198A1" text-anchor="start">Depois disso, atualiza sozinho todos os dias.</text></g></svg>
